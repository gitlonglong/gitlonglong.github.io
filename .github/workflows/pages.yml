name: Check academic homepage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and validate homepage
        run: |
          python3 scripts/build.py
          python3 scripts/check.py
          node --check dist/assets/site.js
      - name: Check committed pages match the source data
        run: git diff --exit-code -- index.html robots.txt sitemap.xml dist SOURCES.md
